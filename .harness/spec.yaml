schemaVersion: 3

name: governed-operations
description: Keep the governance app installing, linting, building and booting without a wallet or a .env file, and grade an approval that reaches the council's threshold on testnet.

baseline:
  commands:
    - name: install          # required — also used for install fingerprinting
      command: yarn install
    - name: lint
      command: yarn lint
    - name: build
      command: yarn next:build

# Defaults are left implicit (agent claude, prd .harness/prd.md, maxAttempts 3,
# validators.static / validators.commands, packageManager and workspaces detected
# from package.json). Only the opt-in stages are declared below.

# SMOKE — boots the dev server and walks the routes in the smoke file.
validators:
  playwright: .harness/validators/playwright-smoke.yaml

# EVALUATE — grades the running app against the checklist in eval.json.
eval: .harness/eval.json
validator:
  enabled: true

# CHAIN — provisions a funded ECDSA testnet account and injects its key as
# localStorage["burnerWallet.pk"]; the app connects with it on reload (see
# packages/nextjs/services/web3/BurnerSignerProvider.tsx), so assertions
# flagged executableWithTestSigner run end to end. Only `validate-semantic`
# and `run` use it; `validate` and `doctor --recipe-only` ignore it. Export the
# operator variables in the shell (the harness does not read .env).
#
# Paying for a transaction is not the same as approving one: a `ScheduleSign`
# only counts towards the threshold if the key sits in the governance account's
# threshold key. The deploy command below seats the run's signer there before
# the app starts, which is what lets E5 grade an approval rather than a button.
# It reads the demo members' keys from the gitignored setup-state.json, so this
# stage expects a workspace that has already run `yarn setup`.
chainValidation:
  enabled: true
  network: testnet
  operator:
    accountIdEnv: HEDERA_OPERATOR_ID
    privateKeyEnv: HEDERA_OPERATOR_PRIVATE_KEY
  fundingHbar: 5
  sweepBack: true
  expose:
    browserLocalStorageKey: burnerWallet.pk
  deploy:
    commands:
      - name: council-seat
        command: yarn harness:council-seat
        timeoutMs: 120000

templateMetadata:
  name: governed-operations
  frontend: nextjs-app
  solidityFramework: hardhat
