name: governed-operations-smoke
server:
  # The seat runs in front of the server because this command is the only hook both harness entry
  # points share: `validate-semantic` never reaches `chainValidation.deploy`. Without a chain signer
  # — a plain `validate`, or a hand-run — it prints a line and stops, so this stays credential-free.
  command: yarn harness:council-seat && yarn next:dev
  url: http://localhost:3000
  timeoutMs: 120000
defaults:
  timeoutMs: 30000
  hydrationTimeoutMs: 60000
  minBodyTextLength: 20
  failOnConsoleError: true
routes:
  - name: live-map
    path: /
  - name: proposal-detail
    # Any schedule id: SMOKE runs without a .env, so the page renders the setup notice rather than
    # a proposal, and what it checks is that the dynamic route boots.
    path: /governance/0.0.10590552
  - name: new-proposal
    # SMOKE runs without a .env, so the page renders the setup notice; what it checks is that the route boots.
    path: /governance/new
  - name: settings
    # SMOKE runs without a .env, so the page renders the setup notice; what it checks is that the route boots.
    path: /settings
forbidden:
  visibleText:
    - Internal Server Error
    - Application error
    - Unhandled Runtime Error
