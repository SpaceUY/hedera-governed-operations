name: governed-operations-smoke
server:
  # The seat runs in front of the server because this command is the only hook both harness entry
  # points share: `validate-semantic` never reaches `chainValidation.deploy`. Without a chain signer
  # — a plain `validate`, or a hand-run — it prints a line and stops, so this stays credential-free.
  command: yarn harness:council-seat && yarn next:dev
  url: http://localhost:3000
  timeoutMs: 120000
defaults:
  timeoutMs: 30000
  hydrationTimeoutMs: 60000
  minBodyTextLength: 20
  failOnConsoleError: true
routes:
  - name: live-map
    path: /
  - name: proposal-detail
    # SMOKE runs without a .env, so the app reads the template's demo instance on testnet: this is
    # one of its executed proposals, which stays readable on the Mirror Node.
    path: /governance/0.0.10720313
  - name: new-proposal
    # SMOKE runs without a .env, so the wizard renders against the demo instance; no wallet is connected.
    path: /governance/new
  - name: settings
    # SMOKE runs without a .env, so the page renders against the demo instance; no wallet is connected.
    path: /settings
forbidden:
  visibleText:
    - Internal Server Error
    - Application error
    - Unhandled Runtime Error
