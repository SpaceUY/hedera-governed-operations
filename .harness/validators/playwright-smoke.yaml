name: template-baseline-smoke
server:
  command: yarn next:dev
  url: http://localhost:3000
  timeoutMs: 120000
defaults:
  timeoutMs: 30000
  hydrationTimeoutMs: 60000
  minBodyTextLength: 20
  failOnConsoleError: true
routes:
  - name: home
    path: /
  - name: proof-wall
    path: /proof-wall
  - name: explorer
    path: /explorer
forbidden:
  visibleText:
    - Internal Server Error
    - Application error
    - Unhandled Runtime Error
